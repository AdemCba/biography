name: Search Console

# Daily: pull Search Console data and refresh data/seo/focus.md (pages near page one with few clicks
# and their real queries) for the writer. Needs the GSC_SERVICE_ACCOUNT secret; skips without it.

on:
  # Started daily at 08:30 TR by cron-job.org through the workflow_dispatch API: GitHub's own
  # schedule ran up to 7 hours late. Do not add a schedule here, or runs will double up.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gsc
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GSC_SERVICE_ACCOUNT: ${{ secrets.GSC_SERVICE_ACCOUNT }}
      GSC_SITE: ${{ vars.GSC_SITE || 'sc-domain:orbivida.com' }}
      GA_PROPERTY_ID: ${{ vars.GA_PROPERTY_ID || '561160137' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pull Search Console data
        if: ${{ env.GSC_SERVICE_ACCOUNT != '' }}
        run: npm run gsc
      # Same service account, Viewer on the GA4 property. Never blocks the Search Console data.
      - name: Pull Google Analytics data
        if: ${{ env.GSC_SERVICE_ACCOUNT != '' }}
        continue-on-error: true
        run: npm run ga
      # Cited sources that no longer open, for the writer to replace (E-E-A-T: every citation must work).
      - name: Check cited sources
        continue-on-error: true
        timeout-minutes: 8
        run: npm run -s sources
      - name: Save on main
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "orbivida-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -m "data: search console"
            git pull --rebase -X theirs
            git push
          fi
