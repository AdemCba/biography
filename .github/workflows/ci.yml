name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Quality gate on real content
        run: npm run check -- --strict
      - name: Build with test fixtures (exercises every page type)
        run: npm run build
        env:
          CONTENT_DIR: tests/fixtures/content
          NEXT_PUBLIC_SITE_URL: https://www.example.com
