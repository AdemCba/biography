name: Trend scan

# Twice a day: find notable people trending on Google and Wikipedia and save the
# filtered list to data/trend-candidates/ on main. The daily writer agent picks
# accepted candidates from there first; nothing is published without research,
# the quality gate and the review agent.

on:
  schedule:
    - cron: "15 6,18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trend-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run trends
      - name: Save the candidate list on main
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "orbivida-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -m "data: trend scan"
            git pull --rebase
            git push
          fi
