name: Writer

# Twice a day (08:00 and 16:00 Istanbul): Claude Code picks 5 people from current Google searches, writes them
# in every language, fact-checks them and records the verdicts, following docs/subscription-writer-task.md.
# It runs on the owner's own Claude subscription (CLAUDE_CODE_OAUTH_TOKEN from `claude setup-token`),
# not on the API. The Publish workflow then adds photos, schedules, deploys and pings IndexNow.
on:
  # Started every 3 hours by cron-job.org through the workflow_dispatch API: GitHub's own
  # schedule ran hours late. Do not add a schedule here, or runs will double up.
  workflow_dispatch:
    inputs:
      count:
        description: "Kaç kişi yazılsın (0 = sadece gündem, hızlı çalışma)"
        default: "5"
      topics:
        description: "Her dil için kaç gündem yazısı (o dilin ülkelerinde trend olan konulardan)"
        default: "2"
      people:
        description: "İstediğin kişiler, virgülle (boş = trendlerden seç). Ör: Arda Güler, Kenan Yıldız"
        required: false
        default: ""

# Topics-only runs (count 0) have their own queue so they are never stuck behind a long people run.
concurrency:
  group: writer-${{ inputs.count == '0' && 'topics' || 'people' }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write
  id-token: write

jobs:
  write:
    if: ${{ vars.WRITER_ENABLED != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Fresh Google Trends + Wikipedia scan, so a manual run picks from what people search right now.
      - name: Scan today's trends
        continue-on-error: true
        run: npm run trends

      - name: Write and fact-check new people (Claude Code on the owner's subscription)
        if: ${{ env.HAS_TOKEN == 'true' }}
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          show_full_output: true
          claude_args: >-
            --model ${{ vars.WRITER_MODEL || 'claude-haiku-5-5' }}
            --max-turns 600
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep,WebSearch,WebFetch,Task,TodoWrite"
          prompt: |
            This is an unattended run: nobody will answer questions, so never stop to ask or to confirm. Keep working
            until every step is done. Follow docs/subscription-writer-task.md for ${{ inputs.count || 5 }} new people, with these changes:
            - TOPICS-ONLY RUN when the people count is 0 (this run: "${{ inputs.count || 5 }}"): write only the
              trending topic articles below, from the freshest rows of "Son 4 saatte Google'da yükselen konular",
              skipping stories that already have a page in content/topics. Do not write or repair people pages
              and skip the "Traffic first" and repair steps. Be quick: a few strong sources per topic, one
              fact-check pass, then schedule and finish. Write the summary as usual.
            - People the owner asked for: "${{ inputs.people }}". If this is not empty, write exactly these people
              (one per comma; ignore the count and skip the trend pick below). If one of them already has a page in
              content/people, update and expand that page in all five languages with today's news instead of
              making a new one. Still drop minors and anyone who would need sexual or private content.
            - Skip step 1 (the repository is already checked out and installed) and the photo step (Publish does it).
            - When no people were named above, pick the people from today's trends only: read data/trend-candidates/latest.md (Google Trends +
              Wikipedia spikes, scanned twice a day) and confirm with WebSearch that each one is in today's news.
              Prefer living people whose current activity is why they trend (footballers, F1 drivers, creators,
              streamers, musicians); skip people trending only because of an anniversary or an old film on TV.
              Do not take names from content/queue.json.
            - Do the writing and fact-checking yourself or with subagents on the same model. Never start a
              subagent in the background: run each one in the foreground (several in one message is fine) and
              wait for its result. When you end your turn the run is over and unfinished work is lost.
            - Step 6: only run `npx tsx scripts/schedule.ts --per-day 1000` (everything goes live the same day). Do not commit, push or open a PR;
              the workflow commits after you finish.
            - Always finish all the people (the named ones, or ${{ inputs.count || 5 }} from trends) in all five languages. To save usage, keep research
              short (the fewest sources that back every claim) and fact-check in one pass where you can; never drop
              a person or a language.
            - Before you finish, `npm run -s check` must show no ERROR and no `short-for-importance` warning for any
              page you wrote: expand short pages with more sourced facts (the importance minimum is a floor, not a
              target) and cite at least one primary source (official site, club, league, award body, company or
              interview) with the matching source type. Fill `facts` in person.json (at least nationality, and
              birth date/place when a source gives them) with source ids; an empty `facts` blocks the page.
            - Titles for clicks (Search Console: most searches are "<name> age/Alter/edad/âge/idade", and pages
              at position ~10 get almost no clicks, so the title must make people choose this result):
              metaTitle answers the top question in the page's language with the {age} placeholder (filled with
              the current age at build time), e.g. "Alexia Putellas: Alter ({age}), Wechsel und neuer Verein".
              metaDescription opens with the answer, e.g. "Alexia Putellas ist {age} Jahre alt (geboren am
              4. Februar 1994).", then one concrete fact from today's news. Use {age} only when person.json
              has birthDate. Keep metaTitle under 60 characters and metaDescription under 160.
            - Traffic first: the fastest wins are people who already have a page and trend again (section
              "Sitede zaten var, güncellemeye aday" of latest.md). Before writing new people, update up to 3 of
              them in all five languages: a dated "## <Month Year>" section on why they are in the news, refreshed
              summary, updatedAt: today. For every person and topic, write the questions people type for that name
              as FAQ entries and targetQueries ("who is X", "X age", "X wife/husband/partner", "X net worth",
              "where is X from", "X height", "X club/team now"), answered from sources. Skip only what a source
              cannot answer and anything about private life of non-public people, health, sex or crime.
            - Small gaps are not blockers. When no source gives a nationality, a birthplace detail or an exact
              date, leave that field out (or say the sources differ, e.g. "born in 1978 or 1979") and carry on.
              Never leave a page in review or flagged for a human for such gaps: fix what the fact-check found
              that is clearly wrong, then set status: approved, reviewer: fact-check-desk, reviewedAt: today and
              remove flag/reviewNotes. Only drop a person when the page would rest on rumour, private life or
              sexual content.
            - Then, if usage allows, repair up to 2 existing pages: pick pages from `npm run -s check` that are in
              status review or show ERROR, `too-short` or `short-for-importance`, expand or fix them in all languages with sourced facts, and fact-check them
              again with review.ts. Never remove a page.
            - Trending topics: for EACH of the five languages, write ${{ inputs.topics || 2 }} topic article(s) about what
              is trending in that language's own countries, from the section "Son 4 saatte Google'da yükselen konular"
              of data/trend-candidates/latest.md (column "Diller": a French trend gets a fr page, a Brazilian one pt).
              Write each topic only in the languages listed for it in "Diller", never in languages where nobody
              searches it; a story trending in several language areas gets one folder with each of those languages. Skip deaths, accidents, crime, war, elections and politics, and anything about minors or
              sexual content. Confirm the story with WebSearch, then create content/topics/<id>/topic.json
              ({"id", "people": [ids of people on this site the story is about], "trendingIn": [geos],
              "sources": [same format as person.json]}) and <locale>.md for those languages with the same
              frontmatter as a biography (title, slug, metaTitle, metaDescription, summary, status, author,
              targetQueries). Each text: at least 450 words, at least two `##` sections (what happened, the
              background, what comes next), cited with [s:id] from at least two sources, written for that
              language's readers. Link people with [Name](person:person-id). If a person in the story has no page and is
              notable, write their biography too. review.ts does not handle topics: check each topic text against its
              sources in one foreground subagent pass, fix what does not match, then set status: approved,
              reviewer: fact-check-desk, reviewedAt: today. `npm run -s check` must show no ERROR for them (they
              are listed as trending/<id>/<locale>); schedule.ts publishes them with the biographies.
            - Step 7: write the Turkish summary (who you picked, why each is searched today, which pages passed) to
              writer-summary.md in the repository root and also print it as your final answer.

      - name: Summary (who was picked and why)
        if: ${{ always() }}
        run: cat writer-summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "No summary written" >> "$GITHUB_STEP_SUMMARY"

      # Safety net: whatever the run wrote is kept as a downloadable artifact for 14 days,
      # so a failed push never loses an hour of writing.
      - name: Keep a copy of the written pages
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: writer-output
          path: |
            content/
            data/
            writer-summary.md
          retention-days: 14
          if-no-files-found: ignore

      - name: Commit new content to main
        id: commit
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$(git status --porcelain content data)" ]; then
            git config user.name "orbivida-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            # The Claude step removes the checkout credentials when it finishes; push with the job token.
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
            git add content data
            git commit -m "content: twice-daily writer"
            # Other files the run touched (summary, caches) must not block the push, and a trend scan
            # pushed meanwhile must not either: on a conflict keep this run's version.
            git pull --rebase --autostash -X theirs
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Pushes made with GITHUB_TOKEN do not start other workflows, so start Publish explicitly.
      - name: Publish (photos, build, deploy, IndexNow)
        if: ${{ steps.commit.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
